# Build every chapter and run its ctest suite (the self-checking examples, solutions and tests).
#
#   core  every pure C++ chapter (00-12, 15 and the engine part of 14), Debug and Release, on
#         Windows, Linux (x64 and ARM64) and macOS
#   juce  chapters 13-14 with JUCE, including the DawLab 8 smoke test and snapshot (macOS is
#         built too but allowed to fail until it has passed a few times)
#
# Linux ARM64 (ubuntu-24.04-arm) stands in for embedded aarch64 boards such as NXP's
# FRDM i.MX 95. It is allowed to fail in both jobs until it has passed a few times.
#
# Both jobs go through scripts/build.ps1 / scripts/build.sh, so CI also checks the commands the
# README tells learners to run.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JUCE_TAG: "9.0.4"

jobs:
  core:
    name: core (${{ matrix.os }}, ${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        # build.ps1 uses the "Visual Studio 17 2022" generator, so pin the image that has VS 2022
        os: [windows-2022, ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v5

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\build.ps1 -Config ${{ matrix.config }}

      - name: Build and test (Linux / macOS)
        if: runner.os != 'Windows'
        run: ./scripts/build.sh --config ${{ matrix.config }}

  juce:
    name: juce (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
        experimental: [false]
        include:
          - os: macos-latest
            experimental: true
          - os: ubuntu-24.04-arm
            experimental: true
    steps:
      - uses: actions/checkout@v5

      # third_party/ is not in git; clone the pinned JUCE once and reuse it
      - name: Cache JUCE
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: third_party/JUCE
          key: juce-${{ env.JUCE_TAG }}

      - name: Clone JUCE
        if: steps.juce-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch ${{ env.JUCE_TAG }} https://github.com/juce-framework/JUCE.git third_party/JUCE

      - name: Install JUCE dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build xvfb \
            libasound2-dev libjack-jackd2-dev ladspa-sdk libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libglu1-mesa-dev mesa-common-dev libcurl4-openssl-dev libwebkit2gtk-4.1-dev

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\build.ps1 -Only 13-vst-hosting,14-daw-8track -Juce -Config Release

      # DawLab 8's smoke test and snapshot create real windows, so give them a virtual X display
      - name: Build and test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./scripts/build.sh --only 13-vst-hosting,14-daw-8track --juce --config Release

      # macOS runners have a desktop session, so the GUI tests need no virtual display
      - name: Build and test (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/build.sh --only 13-vst-hosting,14-daw-8track --juce --config Release

      - name: Upload DawLab 8 snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dawlab8-snapshot-${{ matrix.os }}
          path: build/dawlab_output/l14_app_snapshot*.png
          if-no-files-found: ignore
