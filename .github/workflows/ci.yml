# Build every chapter and run its ctest suite (the self-checking examples, solutions and tests).
#
#   docs  every relative link and image in the Markdown files, and the files chapters copy from
#         each other (scripts/copied_files.txt)
#   core  every pure C++ chapter (00-12 and the engine parts of 14-20), Debug and Release, on
#         Windows, Linux (x64 and ARM64) and macOS
#   tsan  chapters 15-20 under ThreadSanitizer: their checks run a real audio thread next to the
#         UI thread, and TSan fails the run on any data race between them
#   asan  every pure C++ chapter under AddressSanitizer and UndefinedBehaviorSanitizer
#   juce  chapters 13-20 with JUCE, including the smoke tests and snapshots of DawLab 8 and 15 to
#         20, on Windows, Linux (x64 and ARM64) and macOS
#
# Linux ARM64 (ubuntu-24.04-arm) stands in for embedded aarch64 boards with NXP's i.MX 95. Like macOS
# it was allowed to fail at first; every job of every platform must pass since it passed for weeks.
#
# Both jobs go through scripts/build.ps1 / scripts/build.sh, so CI also checks the commands the
# README tells learners to run.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JUCE_TAG: "9.0.4"

jobs:
  docs:
    name: docs (links)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Check the links and images in the Markdown files
        run: python3 scripts/check_links.py

      - name: Check that the files copied between chapters are still the same
        run: python3 scripts/check_copies.py

  core:
    name: core (${{ matrix.os }}, ${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # build.ps1 uses the "Visual Studio 17 2022" generator, so pin the image that has VS 2022
        os: [windows-2022, ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v5

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\build.ps1 -Config ${{ matrix.config }}

      - name: Build and test (Linux / macOS)
        if: runner.os != 'Windows'
        run: ./scripts/build.sh --config ${{ matrix.config }}

  tsan:
    name: tsan (ubuntu-24.04, chapters 15-20)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # TSan's shadow memory does not fit the 32-bit mmap randomisation of current kernels
      # ("unexpected memory mapping"); 28 bits is what it supports
      - name: Lower the ASLR entropy for TSan
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Build and test under ThreadSanitizer
        env:
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
        run: ./scripts/build.sh --only 15-daw-growing,16-automation,17-recording,18-midi,19-instruments-tempo,20-audio-tempo --sanitize thread --build-dir build-tsan

  asan:
    name: asan + ubsan (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # The same ASLR limit as for TSan; ASan's shadow memory has the same problem
      - name: Lower the ASLR entropy for ASan
        run: sudo sysctl vm.mmap_rnd_bits=28

      # UBSan only prints a message unless it is told to stop, and then the test would still pass
      - name: Build and test under AddressSanitizer and UndefinedBehaviorSanitizer
        env:
          UBSAN_OPTIONS: halt_on_error=1 print_stacktrace=1
        run: ./scripts/build.sh --sanitize address,undefined --build-dir build-asan

  juce:
    name: juce (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v5

      # third_party/ is not in git; clone the pinned JUCE once and reuse it
      - name: Cache JUCE
        id: juce-cache
        uses: actions/cache@v6
        with:
          path: third_party/JUCE
          key: juce-${{ env.JUCE_TAG }}

      - name: Clone JUCE
        if: steps.juce-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch ${{ env.JUCE_TAG }} https://github.com/juce-framework/JUCE.git third_party/JUCE

      - name: Install JUCE dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build xvfb \
            libasound2-dev libjack-jackd2-dev ladspa-sdk libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libglu1-mesa-dev mesa-common-dev libcurl4-openssl-dev libwebkit2gtk-4.1-dev

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\build.ps1 -Only 13-vst-hosting,14-daw-8track,15-daw-growing,16-automation,17-recording,18-midi,19-instruments-tempo,20-audio-tempo -Juce -Config Release

      # The apps' smoke tests and snapshots create real windows, so give them a virtual X display
      - name: Build and test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./scripts/build.sh --only 13-vst-hosting,14-daw-8track,15-daw-growing,16-automation,17-recording,18-midi,19-instruments-tempo,20-audio-tempo --juce --config Release

      # macOS runners have a desktop session, so the GUI tests need no virtual display
      - name: Build and test (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/build.sh --only 13-vst-hosting,14-daw-8track,15-daw-growing,16-automation,17-recording,18-midi,19-instruments-tempo,20-audio-tempo --juce --config Release

      - name: Upload the snapshots of DawLab 8 and 15 to 20
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dawlab-snapshots-${{ matrix.os }}
          path: |
            build/dawlab_output/l14_app_snapshot*.png
            build/dawlab_output/l15_app_snapshot*.png
            build/dawlab_output/l16_app_snapshot*.png
            build/dawlab_output/l17_app_snapshot*.png
            build/dawlab_output/l18_app_snapshot*.png
            build/dawlab_output/l19_app_snapshot*.png
            build/dawlab_output/l20_app_snapshot*.png
          if-no-files-found: ignore
